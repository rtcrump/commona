name = "commona"
main = "src/worker.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]
# Replace this placeholder after you create a Cloudflare account. This file does not deploy.
account_id = "00000000000000000000000000000000"

[dev]
ip = "127.0.0.1"
port = 3000

[vars]
COMMONA_PUBLIC_ORIGIN = "https://example.invalid"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DirectoryObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DirectoryObject"]

[[rules]]
type = "Text"
globs = ["**/*.txt", "**/*.html", "**/*.css", "**/*.md"]
fallthrough = true

[[rules]]
type = "Text"
globs = ["**/web/onboarding/connect.js"]
fallthrough = false
