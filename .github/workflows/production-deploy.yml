name: production-deploy

# Manual only. A pull request, push, or tag does not deploy.
on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Full 40-character commit id of the current main tip"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-commona-demo:
    name: deploy-commona-demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.COMMONA_DEMO_ENVIRONMENT_URL }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check the commit id
        env:
          GIT_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          case "$GIT_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *)
              echo "git_sha must be the full commit id of the current main tip"
              exit 1
              ;;
          esac

      - name: Check out that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Require the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_SHA: ${{ inputs.git_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$REPO" in
            */*/*|'') echo "refusing repository"; exit 1 ;;
          esac
          main_sha="$(gh api -H "Accept: application/vnd.github+json" "repos/${REPO}/commits/main" --jq .sha)"
          if [ "$GIT_SHA" != "$main_sha" ]; then
            echo "refusing: git_sha is not the current main commit"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GIT_SHA" ]; then
            echo "refusing: checkout does not match git_sha"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Require the demo deploy credential
        env:
          DEMO_DEPLOY_TOKEN: ${{ secrets.COMMONA_DEMO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEMO_DEPLOY_TOKEN}" ]; then
            echo "The production environment secret COMMONA_DEMO_DEPLOY_TOKEN is not set."
            exit 1
          fi

      - name: Prepare the demo worker config
        env:
          COMMONA_DEMO_ACCOUNT_ID: ${{ vars.COMMONA_DEMO_ACCOUNT_ID }}
          COMMONA_DEMO_ENVIRONMENT_URL: ${{ vars.COMMONA_DEMO_ENVIRONMENT_URL }}
        run: python3 scripts/demo_worker_config.py render --out .wrangler-demo-deploy.toml

      - name: Deploy the commona-demo Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.COMMONA_DEMO_DEPLOY_TOKEN }}
          accountId: ${{ vars.COMMONA_DEMO_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4.151.1"
          command: deploy --config .wrangler-demo-deploy.toml

      - name: Confirm the public origin answers
        env:
          COMMONA_DEMO_ENVIRONMENT_URL: ${{ vars.COMMONA_DEMO_ENVIRONMENT_URL }}
        run: python3 scripts/demo_worker_config.py smoke

      - name: Remove the generated deploy config
        if: always()
        run: rm -f .wrangler-demo-deploy.toml
